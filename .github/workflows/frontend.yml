name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    name: 1. Code Linting & Style Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  test:
    name: 2. Vitest Unit Testing
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  build:
    name: 3. Production Build
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Upload Build Artifact (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: 4. Deploy Frontend
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact (dist/)
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Verify dist/ Content & Deploy
        run: |
          echo "=========================================================="
          echo "🚀 MEMULAI DEPLOYMENT FRONTEND KE LINGKUNGAN PRODUKSI"
          echo "=========================================================="
          echo "Catatan: Job deploy TIDAK menjalankan 'npm run build' ulang."
          echo "Semua file statis diambil langsung dari hasil artifact job build."
          echo "=========================================================="
          echo "📂 Daftar file dalam folder dist/:"
          ls -la frontend/dist
          echo "----------------------------------------------------------"
          echo "📂 Isi direktori assets/:"
          ls -la frontend/dist/assets
          echo "----------------------------------------------------------"
          SIZE=$(du -sk frontend/dist | cut -f1)
          echo "📊 Total ukuran bundle dist/: ${SIZE} KB"
          echo "=========================================================="
          echo "✅ DEPLOYMENT FRONTEND BERHASIL DISELESAIKAN"
          echo "=========================================================="
